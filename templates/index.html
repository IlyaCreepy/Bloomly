<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../css/style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <title>Bloomy</title>
    <link rel="icon" type="image/x-icon" href="../img/icon.svg" />
  </head>
  <body>
    <header class="static-header">
      <div class="header-container">
        <div class="logo">
          <img
            src="../img/icon.svg"
            style="width: 4.5vw; min-width: 35px; aspect-ratio: 1"
          />
        </div>
        <nav
          class="desktop-nav"
          style="text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5)"
        >
          <ul>
            <li><a href="#main">Главная</a></li>
            <li><a href="#about">О нас</a></li>
            <li><a href="#stock">Акции</a></li>
            <li><a href="#catalog">Каталог</a></li>
            <li><a href="#delivery">Доставка</a></li>
            <li><a href="#contact">Отзывы</a></li>
          </ul>
        </nav>
        <button class="burger-btn" aria-label="Меню" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <header class="sticky-header">
      <div class="header-container">
        <div class="logo">
          <img
            src="../img/icon.svg"
            style="width: 4.5vw; min-width: 35px; aspect-ratio: 1"
          />
        </div>
        <nav class="desktop-nav">
          <ul>
            <li><a href="#main">Главная</a></li>
            <li><a href="#about">О нас</a></li>
            <li><a href="#stock">Акции</a></li>
            <li><a href="#catalog">Каталог</a></li>
            <li><a href="#delivery">Доставка</a></li>
            <li><a href="#contact">Отзывы</a></li>
          </ul>
        </nav>
        <button class="burger-btn" aria-label="Меню" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <div class="mobile-menu">
      <button class="close-btn" aria-label="Закрыть меню">
        <span></span>
        <span></span>
      </button>
      <nav>
        <ul>
          <li><a href="#main">Главная</a></li>
          <li><a href="#about">О нас</a></li>
          <li><a href="#stock">Акции</a></li>
          <li><a href="#catalog">Каталог</a></li>
          <li><a href="#delivery">Доставка</a></li>
          <li><a href="#contact">Отзывы</a></li>
        </ul>
      </nav>
    </div>

    <main>
      <section class="hero-container" id="main">
        <img src="../img/left.png" class="slide-image left-image" />
        <img src="../img/right.png" class="slide-image right-image" />
      </section>
      <section class="about-container" id="about"></section>
      <section class="stock-container" id="stock">
        <img src="../img/stock-left.png" class="slide-image left-image" />
        <img src="../img/stock-right.png" class="slide-image right-image" />
        <div class="btn-buy-now">Купить сейчас</div>
      </section>
      <section class="main-container">
        <div></div>
      </section>
    </main>

    <script src="../scripts/script.js"></script>
  </body>
</html>
